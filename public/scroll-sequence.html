<!-- ===== Paste this section where you want the video (bottom of the page) ===== -->
<section id="seq-wrap" class="seq-wrap" aria-label="A walk up to The Birthwave clinic">
  <div class="seq-sticky">
    <canvas id="seq-canvas"></canvas>
    <!-- Optional overlay text; delete if not needed -->
    <div class="seq-overlay">
      <h2>Visit The Birthwave</h2>
      <p>The Holistic Wellness Clinic</p>
    </div>
  </div>
</section>

<style>
  /* Height controls how long the scroll lasts: 400vh ≈ 3 screens of scrolling */
  .seq-wrap { position: relative; height: 400vh; background: #000; }
  .seq-sticky { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
  #seq-canvas {
    display: block; width: 100%; height: 100%;
    /* Poster shown until frames load */
    background: #111 url('/frames/desktop/f_0001.webp') center / cover no-repeat;
  }
  .seq-overlay {
    position: absolute; left: 0; right: 0; bottom: 8vh; text-align: center;
    color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.5); pointer-events: none;
  }
  .seq-overlay h2 { margin: 0; font-size: clamp(1.8rem, 4vw, 3.2rem); }
  .seq-overlay p  { margin: .4rem 0 0; opacity: .85; }
  @media (max-width: 767px) {
    .seq-wrap { height: 300vh; }
    #seq-canvas { background-image: url('/frames/mobile/f_0001.webp'); }
  }
  /* Reduced motion: no pinned scroll, just a still image */
  .seq-wrap.seq-static { height: 100vh; }
</style>

<script src="/scroll-sequence.js" defer></script>
