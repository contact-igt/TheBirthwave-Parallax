<!-- ===== "Our Approach" slow-motion section — reference markup ===== -->
<section id="approach-wrap" class="approach-wrap" aria-label="Inside The Birthwave">
  <div class="approach-sticky">
    <canvas id="approach-canvas"></canvas>
    <div class="approach-shade"></div>

    <div class="approach-text">
      <p class="approach-eyebrow">Our Approach</p>
      <h2 class="approach-title">Care that makes room for you.</h2>
      <ul class="approach-points">
        <!-- Replace with your real "Our Approach" points -->
        <li style="--i:0">Time to listen</li>
        <li style="--i:1">Care across every stage</li>
        <li style="--i:2">Medicine with warmth</li>
      </ul>
    </div>
  </div>
</section>

<style>
  /* 600vh = ~5 screens of scrolling → slow motion */
  .approach-wrap { position: relative; height: 600vh; background: #1a120e; --p: 0; }
  .approach-sticky { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
  #approach-canvas {
    display: block; width: 100%; height: 100%;
    background: #1a120e url('/frames2/desktop/f_0001.webp') center / cover no-repeat;
  }
  .approach-shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(26,18,14,.72) 0%, rgba(26,18,14,.35) 40%, transparent 65%);
    opacity: clamp(0, calc((var(--p) - .25) * 6), 1);
  }
  .approach-text {
    position: absolute; left: 8vw; top: 50%; transform: translateY(-50%);
    max-width: 34rem; color: #FBF5F0; text-shadow: 0 2px 20px rgba(0,0,0,.4);
  }
  /* Heading fades in at ~30–40% of the scroll */
  .approach-eyebrow, .approach-title {
    opacity: clamp(0, calc((var(--p) - .30) * 10), 1);
    transform: translateY(calc((1 - clamp(0, calc((var(--p) - .30) * 10), 1)) * 24px));
  }
  .approach-eyebrow { margin: 0 0 .6rem; letter-spacing: .2em; text-transform: uppercase; font-size: .8rem; color: #F4C9B8; }
  .approach-title { margin: 0 0 1.5rem; font-size: clamp(2rem, 4.5vw, 3.6rem); line-height: 1.1; }
  /* Points fade in one by one after the pillar passes (60%+) */
  .approach-points { list-style: none; margin: 0; padding: 0; }
  .approach-points li {
    font-size: 1.15rem; padding: .5rem 0; border-top: 1px solid rgba(251,245,240,.25);
    opacity: clamp(0, calc((var(--p) - .60 - var(--i) * .08) * 12), 1);
  }

  @media (max-width: 767px) {
    .approach-wrap { height: 450vh; }
    #approach-canvas { background-image: url('/frames2/mobile/f_0001.webp'); }
    .approach-shade { background: linear-gradient(to top, rgba(26,18,14,.92) 0%, rgba(26,18,14,.7) 40%, rgba(26,18,14,0) 70%); }
    .approach-text { left: 20px; right: 20px; top: auto; bottom: calc(96px + env(safe-area-inset-bottom)); transform: none; }
  }
  .approach-wrap.approach-static { height: 100vh; --p: 1 !important; }
</style>

<script src="/approach-sequence.js" defer></script>
